services:
  nexusrouter:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NEXUSROUTER_DATABASE__DRIVER: postgres
      NEXUSROUTER_DATABASE__DSN: "postgres://nexusrouter:${POSTGRES_PASSWORD:-nexusrouter}@postgres:5432/nexusrouter?sslmode=disable"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexusrouter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexusrouter}
      POSTGRES_DB: nexusrouter
    volumes:
      - nexusrouter-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexusrouter -d nexusrouter"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nexusrouter-pg:
